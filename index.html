<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MarLagos">
<title>MarLagos Passeios</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
  /* Paleta ELO Sistemas (mesmos tons do ELO Compras) */
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f6f8fb; --line:#c3ccd8; --line2:#e2e8f0; --field:#a6b0bd;
  --ink:#111827; --ink2:#5b6573; --ink3:#8a93a0; --title:#1e3a8a; --label:#1d3f96;
  --sea:#23459c; --sea-d:#1b3680; --sea-ink:#ffffff; --sea-soft:#eef2fb;
  --navy:#1e3a8a; --navy-ink:#ffffff;
  --buoy:#b45309; --buoy-soft:#fef3c7;
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7;
  --info:#1d4ed8; --info-soft:#dbeafe; --mute:#475569; --mute-soft:#eef2f7;
  --danger:#b91c1c; --danger-soft:#fee2e2;
  --deck:#f6f8fb; --deck-line:#e6ebf3; --hull:#23459c;
  --display:"Segoe UI",Tahoma,Verdana,Arial,sans-serif;
  --body:"Segoe UI",Tahoma,Verdana,Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
*{-webkit-tap-highlight-color:transparent}
.shell{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:9px 14px;background:linear-gradient(#ffffff,#f4f7fc);color:var(--title);border-bottom:1px solid var(--line2)}
.hamb{background:none;border:0;padding:6px 4px;display:grid;place-items:center;color:var(--title);min-width:40px;min-height:40px}
.hamb svg,.dnav svg,.iconbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.appbar-logo{height:30px;width:auto}
.appbar-title{flex:1;min-width:0;display:flex;flex-direction:column}
.appbar-title b{font-size:18px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-title span{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db{font-size:12px;background:var(--sea-soft);color:var(--title);padding:5px 10px;border-radius:20px;white-space:nowrap;font-weight:600}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:10px;width:44px;height:42px;display:inline-grid;place-items:center;color:var(--title);padding:0}
.iconbtn svg{width:21px;height:21px}
.drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:60}
.drawer-overlay.open{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:310px;background:#fff;transform:translateX(-100%);transition:transform .25s ease;z-index:70;display:flex;flex-direction:column;box-shadow:2px 0 24px rgba(0,0,0,.22);padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.drawer-head{padding:18px 16px 14px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.drawer-head img{height:62px;width:auto}
.drawer-head span{font-size:13px;color:var(--ink2)}
.drawer-nav{padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.dnav{display:flex;align-items:center;gap:14px;padding:14px 12px;border:0;background:none;border-radius:10px;font-size:17px;font-weight:600;color:#374151;text-align:left;width:100%}
.dnav svg{width:22px;height:22px}
.dnav[aria-current=page]{background:var(--sea-soft);color:var(--sea)}
.drawer-foot{margin-top:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line2)}
main{flex:1;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin:0;text-wrap:balance;color:var(--title)}
h2{font-family:var(--display);font-weight:700;font-size:16px;margin:0;letter-spacing:.05em;text-transform:uppercase;color:var(--title)}
.sub{color:var(--ink2);font-size:15px;margin:2px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.06);display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
input[type=text],input[type=tel],input[type=number],input[type=url],input[type=date],select{width:100%;background:#fff;border:1px solid var(--field);border-radius:9px;padding:11px 12px;font-size:16px;text-transform:none;letter-spacing:0;font-weight:500}
input:focus,select:focus{border-color:var(--sea);outline:none;box-shadow:0 0 0 3px rgba(35,69,156,.15)}
.btn{border:0;border-radius:12px;padding:15px 18px;min-height:52px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--sea);color:var(--sea-ink)}
.btn.pri:active{background:var(--sea-d)}
.btn.hot{background:var(--ok);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:#374151}
.btn.sm{padding:10px 14px;min-height:44px;font-size:15px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{background:none;border:0;padding:4px 0;color:var(--sea);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;min-height:44px;font-size:15px;font-weight:600}
.chip[aria-pressed=true]{background:var(--sea);color:#fff;border-color:var(--sea)}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.slot .h{font-family:var(--display);font-size:32px;font-weight:800;color:var(--title);line-height:1}
.slot .r{font-size:13.5px;color:var(--ink2);font-weight:600;min-height:1.2em}
.slot[aria-pressed=true]{border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-soft)}
.slot:disabled{opacity:.55;cursor:not-allowed}
.gauge{height:6px;border-radius:3px;background:var(--mute-soft);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--sea)}
.gauge.full i{background:var(--danger)}
.gauge.hi i{background:var(--warn)}
.vagas{font-size:15px;font-weight:700}
.vagas.z{color:var(--danger)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:54px;height:54px;border:0;background:var(--surface2);font-size:22px;font-weight:700}
.stepper output{width:58px;text-align:center;font-family:var(--display);font-size:30px;font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px}
.total b{font-family:var(--display);font-size:30px;font-weight:800;color:var(--title)}
.k{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.m{display:inline-flex;justify-content:space-between;gap:.5em;min-width:7.2em;font-variant-numeric:tabular-nums;white-space:nowrap}
.m .c{color:var(--ink3);font-weight:500}
.code{font-family:var(--mono);font-weight:700;letter-spacing:.04em}
.pill{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-aguardando{background:var(--warn-soft);color:var(--warn)}
.p-pagamento_informado{background:var(--info-soft);color:var(--info)}
.p-pago{background:var(--ok-soft);color:var(--ok)}
.p-cancelada,.p-expirada{background:var(--mute-soft);color:var(--mute)}
.p-emb{background:var(--ok-soft);color:var(--ok)}
.p-nao{background:var(--buoy-soft);color:var(--buoy)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}
.item .s{font-size:14.5px;color:var(--ink2)}
.item .a{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.pager{display:flex;justify-content:center;align-items:center;gap:18px;font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pager button{width:52px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.pager button:disabled{opacity:.35}
.tw{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:8px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--display);font-size:22px;font-weight:800;color:var(--title);font-variant-numeric:tabular-nums}
.stat .v .m{min-width:0;gap:.3em}
.note{font-size:14.5px;color:var(--ink2);background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;line-height:0}
.qr img,.qr canvas{display:block}
.center{text-align:center;align-items:center}
.ticket{background:linear-gradient(160deg,#23459c 0%,#16306f 100%);color:var(--navy-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}
.ticket .k{color:var(--navy-ink);opacity:.6}
.ticket h1{color:var(--navy-ink)}
.ticket .perf{border-top:2px dashed rgba(255,255,255,.25);margin:4px -18px}
.pixbox{font-family:var(--mono);font-size:12.5px;word-break:break-all;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px;max-height:4.8em;overflow:hidden}
.timer{display:inline-flex;align-items:center;gap:6px;background:var(--buoy-soft);color:var(--buoy);font-weight:700;padding:8px 12px;border-radius:10px;font-variant-numeric:tabular-nums;font-size:16px}
.pax{display:grid;grid-template-columns:1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.pax .k{margin-bottom:-2px}
.chk{display:flex;align-items:center;gap:12px;padding:14px 0;min-height:56px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:28px;height:28px;accent-color:var(--ok)}
.ok-banner{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:14px;font-weight:700;display:flex;gap:10px;align-items:center}
.err-banner{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 14px;font-weight:600}
.badge{background:linear-gradient(160deg,#23459c 0%,#16306f 100%);color:var(--navy-ink);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--sea)!important;color:#fff;font-family:var(--display);font-size:38px;font-weight:700;display:grid;place-items:center;border:3px solid rgba(255,255,255,.8)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{flex:1 1 auto;border:1px solid var(--line);background:#fff;padding:10px 14px;min-height:44px;border-radius:999px;font-weight:700;color:#374151;font-size:15px}
.tabs button[aria-selected=true]{color:#fff;background:var(--sea);border-color:var(--sea)}
.man-head{border:2px solid var(--ink);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.man-head .ti{font-family:var(--display);font-size:19px;font-weight:800;color:var(--title);letter-spacing:.04em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:15.5px;z-index:20;max-width:calc(100% - 32px)}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600;padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.demo-bar button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline}
.ex{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;text-transform:uppercase}
.boat{display:flex;justify-content:center}
.hull{width:min(100%,264px);background:var(--deck);border:3px solid var(--hull);border-radius:50% 50% 26px 26px / 120px 120px 26px 26px;padding:70px 16px 12px;display:flex;flex-direction:column;gap:6px;background-image:repeating-linear-gradient(90deg,transparent 0 22px,var(--deck-line) 22px 23px)}
.bow,.stern{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--hull);text-align:center}
.bow{margin-top:-40px;margin-bottom:14px}
.stern{margin-top:6px;border-top:2px solid var(--hull);padding-top:6px}
.srow{display:grid;grid-template-columns:1fr 1fr 14px 1fr 1fr;gap:6px}
.seat{aspect-ratio:1;border-radius:9px 9px 4px 4px;font-size:13px;font-weight:800;display:grid;place-items:center;border:1.5px solid transparent;padding:0;font-variant-numeric:tabular-nums}
.s-free{background:#fff;border-color:var(--field);color:var(--label)}
.s-sel{background:var(--sea);color:#fff;border-color:var(--sea)}
.s-res{background:repeating-linear-gradient(45deg,var(--warn-soft) 0 5px,var(--surface) 5px 10px);border-color:var(--warn);color:var(--warn)}
.s-pago{background:#cbd5e1;color:#475569}
.s-emb{background:var(--ok);color:#fff}
.s-void{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:14px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:17px;height:17px;border-radius:4px;display:inline-block;border:1.5px solid transparent}
.bigqr{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}
.or{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
details.more summary{cursor:pointer;font-weight:600;color:var(--sea);font-size:15px;padding:8px 0}
.rules{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:15px}
.rules b{font-family:var(--display);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:800;background:var(--surface2);border-top:2px solid var(--line);border-bottom:0}
.stat.hi{background:var(--sea-soft);border-color:var(--sea)}
.lay2,.lay-venda{display:flex;flex-direction:column;gap:14px}
.lay2>*,.lay-venda>*{min-width:0}
.cam{position:relative;background:#0f172a;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-height:52vh;width:100%;display:grid;place-items:center;color:#9FB3BB;font-size:13px;text-align:center}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18% 22%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .fb{position:absolute;left:10px;right:10px;bottom:10px;padding:12px;border-radius:10px;font-weight:800;font-size:17px}
.cam .fb.ok{background:var(--ok);color:#fff}.cam .fb.err{background:var(--danger);color:#fff}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ink2)}
.sw input{width:24px;height:24px;accent-color:var(--sea)}
/* ---- tablet ---- */
@media (min-width:760px){
  .shell{max-width:1100px}
  .appbar{padding-inline:24px}
  main{padding:20px 24px 100px}
  h1{font-size:32px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stats.six{grid-template-columns:repeat(3,1fr)}
  .slots{grid-template-columns:repeat(3,1fr)}
  .lay2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .lay-venda{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"hor seat" "pass seat" "list list";gap:16px;align-items:start}
  .lay-venda.solo{grid-template-areas:"hor hor" "list list"}
  .a-hor{grid-area:hor}.a-seat{grid-area:seat}.a-pass{grid-area:pass}.a-list{grid-area:list}
  .hull{width:min(100%,300px)}
  .panel{padding:18px}
}
@media (min-width:1024px){
  .stats.six{grid-template-columns:repeat(6,1fr)}
  .stat .v{font-size:21px}
}
/* ---- organização de campos e botões ---- */
.fg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;align-items:end}
.fsec{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--title);padding-top:10px;margin-top:4px;border-top:1px solid var(--line2)}
.acts{display:grid;grid-template-columns:1fr;gap:10px}
.acts.two{grid-template-columns:1fr 1fr}
.acts .btn{width:100%}
.item .a{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item .a>:first-child,.item .a>:last-child:nth-child(even){grid-column:1/-1}
.item .a .btn{width:100%}
.stepper{width:100%;justify-content:space-between}
.stepper output{flex:1}
input.big{height:56px;font-size:20px!important;font-weight:700;text-align:right}
.total{flex-wrap:wrap;gap:4px 10px}
.total .k{white-space:nowrap}
.total .m,.ok-banner .m,.stat .m{min-width:0;gap:.3em}
.legend i.s-free{border-color:var(--field)}.legend i.s-res{border-color:var(--warn)}
details.more>summary{list-style:none;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:center;background:#fff}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:12px}
@media (max-width:600px){
  .tw{overflow:visible}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tfoot{display:block}
  table.stack tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:12px 2px;border-bottom:1px solid var(--line)}
  table.stack td{border:0;padding:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left!important;background:none}
  table.stack.c3 tr{grid-template-columns:repeat(3,minmax(0,1fr))}
  table.stack td::before{content:attr(data-label);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
  table.stack td.first{grid-column:1/-1;order:-1;font-weight:700;font-size:16px;color:var(--title)}
  table.stack td.first::before{display:none}
  table.stack td[colspan]{grid-column:1/-1}
  table.stack td[colspan]::before{display:none}
  table.stack tfoot tr{background:var(--surface2);border-radius:10px;padding:12px;border:0;margin-top:8px}
  table.stack .m{min-width:0;justify-content:flex-start}
}
@media (min-width:600px){ .acts{grid-template-columns:1fr 1fr} }
@media (max-width:380px){.slot .h{font-size:28px}.stat .v{font-size:22px}.brand{font-size:24px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  .appbar,.drawer,.drawer-overlay,.no-print,.demo-bar{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0}
  .panel{border:0;padding:0}

<script>
/* =========================================================
   CAMADA DE DADOS
   Hoje grava no navegador (localStorage). Para ir ao banco,
   basta reescrever as funções do objeto `api` mantendo as
   mesmas assinaturas (todas são async).
   ========================================================= */
const KEY = 'marlagos.v2';
const hoje = () => new Date().toLocaleDateString('sv-SE');
const uid = () => Math.random().toString(36).slice(2,10);
const MIN = 60e3;
let mem = null;

/* ---- Regras de prazo (padrões; cada barco pode ter as suas) ----
   tempoPag  : minutos que o turista tem para pagar depois que o link/QR é gerado
   tempoConf : minutos extras depois do "Já paguei" para o barco conferir o Pix
   corteMin  : vendas do horário fecham X minutos antes da saída
   Nenhum prazo passa do horário de corte. Reserva vencida libera os lugares.
   Pix que chega depois do prazo só é confirmado se ainda houver lugar.          */
const REGRAS_PADRAO = {tempoPag:10, tempoConf:20, corteMin:15};

const saidaTs = s => new Date(`${s.data}T${s.hora}:00`).getTime();
const corteTs = (s,b) => saidaTs(s) - (b.corteMin??REGRAS_PADRAO.corteMin)*MIN;
/* ---- Comissão: regra do vendedor (se tiver) ou a do barco. % do valor vendido ou R$ fixo por passagem ---- */
function regraComissao(b,p){ return (p&&p.comissaoTipo)?{tipo:p.comissaoTipo,valor:+p.comissaoValor||0,origem:'vendedor'}:{tipo:b.comissaoTipo||'pct',valor:+(b.comissaoValor??b.comissaoPct??0),origem:'barco'}; }
function calcComissao(rg,valorUnit,q){ return Math.round((rg.tipo==='fixo'?rg.valor*q:valorUnit*q*rg.valor/100)*100)/100; }
const regraTxt = rg => rg.tipo==='fixo'?`R$ ${Number(rg.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})} por passagem`:`${String(rg.valor).replace('.',',')}% do valor`;
const ativa = (r,now=Date.now()) => r.status==='pago' || ((r.status==='aguardando'||r.status==='pagamento_informado') && r.expiraEm>now);

function horariosDemo(){
  // horários do barco de exemplo a partir de agora, para a demonstração sempre ter saídas abertas
  const d=new Date(); let m=d.getHours()*60+d.getMinutes()+50; m=Math.ceil(m/30)*30;
  const out=[]; for(const add of [0,120,240]){ const t=Math.min(m+add,23*60+30); const h=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`; if(!out.some(x=>x[0]===h)) out.push([h,'']); }
  return out;
}
function seed(){
  const d = hoje(); const hs = horariosDemo();
  const barcos = [
    {id:'b1',nome:'Pérola do Mar',inscricao:'381-094281-1',mestre:'Cap. Silva',cais:'Cais da Praia dos Anjos',capacidade:40,preco:150,precoMin:120,comissaoTipo:'pct',comissaoValor:15,
     pixChave:'passeios@peroladomar.com.br',pixNome:'PEROLA DO MAR PASSEIOS',pixCidade:'ARRAIAL DO CABO',...REGRAS_PADRAO,horarios:hs,ativo:true},
    {id:'b2',nome:'Estrela Guia',inscricao:'381-102377-4',mestre:'Mestre Jair',cais:'Cais da Praia dos Anjos',capacidade:24,preco:130,precoMin:130,comissaoTipo:'fixo',comissaoValor:20,
     pixChave:'22999990000',pixNome:'ESTRELA GUIA TURISMO',pixCidade:'ARRAIAL DO CABO',...REGRAS_PADRAO,horarios:hs.slice(0,2),ativo:true}
  ];
  const promotores = [
    {id:'p1',nome:'Lucas Silva',codigo:'402',whatsapp:'22998765432',pixChave:'22998765432',comissaoTipo:'',comissaoValor:0,barcoIds:['b1','b2'],ativo:true},
    {id:'p2',nome:'Marina Costa',codigo:'415',whatsapp:'22997654321',pixChave:'marina.costa@email.com',comissaoTipo:'pct',comissaoValor:18,barcoIds:['b1'],ativo:true}
  ];
  const db = {barcos,promotores,saidas:[],reservas:[],config:{urlPublica:''}};
  gerarSaidas(db,d);
  const nomes=['Roberto Alves','Juliana Paes','Carla Menezes','Diego Ramos','Fernanda Lima','Paulo Henrique','Aline Souza','Marcos Vieira','Tatiane Rocha','Bruno Castro','Renata Gomes','Igor Nunes','Luana Prado','Sérgio Motta','Patrícia Reis','Thiago Brito'];
  let n=0;
  const pax = q => Array.from({length:q},()=>{const nm=nomes[n++%nomes.length];const x=String(100000000+((n*7919)%899999999)).padStart(9,'0');return {nome:nm,doc:`${x.slice(0,3)}.${x.slice(3,6)}.${x.slice(6,9)}-${String(n%97).padStart(2,'0')}`,embarcado:false}});
  const sd = i => db.saidas.find(x=>x.barcoId==='b1'&&x.hora===hs[Math.min(i,hs.length-1)][0]);
  const add = (i,q,pid,st,extra={}) => {
    const sa=sd(i), b=barcos[0], vu=q>=6?b.precoMin+10:b.preco, valor=q*vu, rg=regraComissao(b,promotores.find(p=>p.id===pid));
    const r={codigo:novoCodigo(db),saidaId:sa.id,promotorId:pid,qtd:q,valorUnit:vu,precoTabela:b.preco,valor,comissao:calcComissao(rg,vu,q),regra:rg,

      assentos:[],passageiros:st==='aguardando'?[]:pax(q),exemplo:true,...extra};
    if(st!=='expirada') r.assentos=autoAssentos(db,sa.id,q,r); else r.assentos=[39,40].slice(0,q);
    db.reservas.push(r);
  };
  [4,6,8,4,6,4].forEach((q,i)=>add(0,q,i%2?'p2':'p1','pago'));
  add(0,2,'p1','pagamento_informado',{expiraEm:Date.now()+14*MIN});
  add(0,2,'p2','aguardando',{expiraEm:Date.now()+6*MIN});
  [2,4,5,3,6].forEach((q,i)=>add(1,q,i%3?'p1':'p2','pago'));
  add(1,2,'p1','expirada',{expiraEm:Date.now()-5*MIN});
  [4,2].forEach((q,i)=>add(2,q,i?'p2':'p1','pago'));
  return db;
}
function gerarSaidas(db,data){
  db.barcos.filter(b=>b.ativo).forEach(b=>b.horarios.forEach(([hora,rotulo])=>{
    if(!db.saidas.some(s=>s.barcoId===b.id&&s.data===data&&s.hora===hora))
      db.saidas.push({id:uid(),barcoId:b.id,data,hora,rotulo,capacidade:b.capacidade,status:'aberta'});
  }));
}
function novoCodigo(db){ let c; do{c='AC-'+(1000+Math.floor(Math.random()*9000))}while(db.reservas.some(r=>r.codigo===c)); return c; }
function mapaAssentos(db,saidaId,ignorar){
  const m={};
  db.reservas.filter(r=>r.saidaId===saidaId&&r!==ignorar&&ativa(r)).forEach(r=>(r.assentos||[]).forEach((num,i)=>{
    const p=r.passageiros[i];
    m[num]={st:r.status==='pago'?(p&&p.embarcado?'emb':'pago'):'res',codigo:r.codigo};
  }));
  return m;
}
function autoAssentos(db,saidaId,q,ignorar){
  const s=db.saidas.find(x=>x.id===saidaId), m=mapaAssentos(db,saidaId,ignorar), out=[];
  for(let k=1;k<=s.capacidade&&out.length<q;k++) if(!m[k]) out.push(k);
  return out;
}
function load(){
  if(mem) return mem;
  try{ mem = JSON.parse(localStorage.getItem(KEY)); }catch(e){ mem=null; }
  if(!mem) mem = seed();
  mem.barcos.forEach(b=>{ if(!b.comissaoTipo){ b.comissaoTipo='pct'; b.comissaoValor=b.comissaoPct??15; } if(b.precoMin==null) b.precoMin=b.preco; });
  mem.reservas.forEach(r=>{ if(r.precoTabela==null) r.precoTabela=r.valorUnit; });
  gerarSaidas(mem,hoje());
  const now=Date.now();
  mem.reservas.forEach(r=>{ if((r.status==='aguardando'||r.status==='pagamento_informado')&&r.expiraEm&&r.expiraEm<=now){ r.status='expirada'; r.expirouEm=r.expiraEm; } });
  return mem;
}
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} }
function ocupacao(db,saidaId){ return db.reservas.filter(r=>r.saidaId===saidaId&&ativa(r)).reduce((a,r)=>a+r.qtd,0); }
const clone = o => JSON.parse(JSON.stringify(o));
const achar = (db,codigo) => db.reservas.find(x=>x.codigo===String(codigo).toUpperCase().trim());

const api = {
  async barcos(){ return clone(load().barcos); },
  async promotores(){ return clone(load().promotores); },
  async config(){ return clone(load().config); },
  async saidas(data){
    const db=load(), now=Date.now();
    return db.saidas.filter(s=>s.data===data).map(s=>{
      const b=db.barcos.find(x=>x.id===s.barcoId);
      const fecha=corteTs(s,b);
      return {...clone(s),ocupadas:ocupacao(db,s.id),barco:clone(b),fechaEm:fecha,vendendo:s.status==='aberta'&&now<fecha,mapa:mapaAssentos(db,s.id)};
    }).sort((a,b)=>a.hora.localeCompare(b.hora));
  },
  async criarReserva({saidaId,promotorId,qtd,assentos,valorUnit}){
    const db=load(); load();
    const s=db.saidas.find(x=>x.id===saidaId), b=db.barcos.find(x=>x.id===s.barcoId);
    const fecha=corteTs(s,b), now=Date.now();
    if(s.status!=='aberta') throw new Error('Esta saída foi encerrada pelo barco.');
    if(now>=fecha) throw new Error(`As vendas deste horário fecharam ${b.corteMin} min antes da saída.`);
    const m=mapaAssentos(db,saidaId);
    let seats=(assentos&&assentos.length)?assentos:autoAssentos(db,saidaId,qtd);
    if(seats.some(k=>m[k])) throw new Error('Um dos assentos escolhidos acabou de ser ocupado. Escolha de novo.');
    if(seats.length<qtd) throw new Error(`Só restam ${seats.length} lugares neste horário.`);
    const vu=Math.round((+valorUnit||b.preco)*100)/100;
    if(vu<(b.precoMin??b.preco)) throw new Error(`O valor mínimo da passagem neste barco é R$ ${fmt(b.precoMin)}.`);
    const q=seats.length, valor=q*vu, rg=regraComissao(b,db.promotores.find(p=>p.id===promotorId));
    const r={codigo:novoCodigo(db),saidaId,promotorId,qtd:q,valorUnit:vu,precoTabela:b.preco,valor,comissao:calcComissao(rg,vu,q),regra:rg,whatsapp:'',
      status:'aguardando',criadoEm:now,expiraEm:Math.min(now+b.tempoPag*MIN,fecha),assentos:seats,passageiros:[]};
    db.reservas.push(r); persist(); return clone(r);
  },
  async reserva(codigo){
    const db=load(); const r=achar(db,codigo); if(!r) return null;
    const s=db.saidas.find(x=>x.id===r.saidaId);
    return {...clone(r),saida:clone(s),barco:clone(db.barcos.find(b=>b.id===s.barcoId)),promotor:clone(db.promotores.find(p=>p.id===r.promotorId))};
  },
  async reservas(filtro={}){
    const db=load();
    return clone(db.reservas.filter(r=>{
      const s=db.saidas.find(x=>x.id===r.saidaId);
      return (!filtro.data||s.data===filtro.data)&&(!filtro.promotorId||r.promotorId===filtro.promotorId)&&(!filtro.saidaId||r.saidaId===filtro.saidaId);
    }).map(r=>({...r,saida:db.saidas.find(x=>x.id===r.saidaId)})).sort((a,b)=>b.criadoEm-a.criadoEm));
  },
  async salvarPassageiros(codigo,passageiros,whatsapp){
    const r=achar(load(),codigo);
    r.passageiros=passageiros.map((p,i)=>({...p,embarcado:r.passageiros[i]?.embarcado||false}));
    if(whatsapp) r.whatsapp=whatsapp; persist();
  },
  async informarPagamento(codigo,passageiros,whatsapp){
    const db=load(); const r=achar(db,codigo);
    if(r.status!=='aguardando') throw new Error(r.status==='expirada'?'O prazo para pagar terminou e os lugares foram liberados. Se você já pagou, mostre o comprovante ao promotor.':'Esta reserva não está mais ativa.');
    const s=db.saidas.find(x=>x.id===r.saidaId), b=db.barcos.find(x=>x.id===s.barcoId);
    r.passageiros=passageiros.map(p=>({...p,embarcado:false})); if(whatsapp) r.whatsapp=whatsapp;
    r.status='pagamento_informado'; r.informadoEm=Date.now();
    r.expiraEm=Math.min(Math.max(r.expiraEm,Date.now()+b.tempoConf*MIN),saidaTs(s));
    persist();
  },
  async confirmarPagamento(codigo){
    const db=load(); const r=achar(db,codigo); let msg='';
    if(r.status==='expirada'||r.status==='cancelada'){
      const m=mapaAssentos(db,r.saidaId,r);
      if(r.assentos.some(k=>m[k])){
        const novos=autoAssentos(db,r.saidaId,r.qtd,r);
        if(novos.length<r.qtd) throw new Error(`Pix fora do prazo e o barco não tem mais ${r.qtd} lugares livres neste horário. Devolva o Pix ou remarque para outra saída.`);
        r.assentos=novos; msg=` · novos assentos ${novos.join(', ')}`;
      }
      r.confirmadoForaDoPrazo=true;
    }
    r.status='pago'; r.expiraEm=null; r.pagoEm=Date.now(); persist();
    return msg;
  },
  async cancelar(codigo){ const r=achar(load(),codigo); r.status='cancelada'; r.expiraEm=null; persist(); },
  async embarcar(codigo,idx,valor){
    const r=achar(load(),codigo);
    if(idx==='all') r.passageiros.forEach(p=>p.embarcado=true); else r.passageiros[idx].embarcado=valor;
    persist();
  },
  async salvarBarco(b){
    const db=load(); if(!b.id){b.id=uid();db.barcos.push(b);} else Object.assign(db.barcos.find(x=>x.id===b.id),b);
    gerarSaidas(db,hoje()); persist();
  },
  async salvarPromotor(p){ const db=load(); if(!p.id){p.id=uid();db.promotores.push(p);} else Object.assign(db.promotores.find(x=>x.id===p.id),p); persist(); },
  async salvarSaida(s){ const db=load(); if(!s.id){s.id=uid();s.status='aberta';db.saidas.push(s);} else Object.assign(db.saidas.find(x=>x.id===s.id),s); persist(); },
  async salvarConfig(c){ Object.assign(load().config,c); persist(); },
  async resetar(){ mem=seed(); persist(); }
};

/* =========================================================
   PIX — BR Code estático (copia-e-cola padrão Banco Central)
   ========================================================= */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}return c.toString(16).toUpperCase().padStart(4,'0');}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
const semAcento=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
function pixPayload({chave,nome,cidade,valor,txid}){
  const p=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',chave))+tlv('52','0000')+tlv('53','986')+
    tlv('54',valor.toFixed(2))+tlv('58','BR')+tlv('59',semAcento(nome).slice(0,25))+tlv('60',semAcento(cidade).slice(0,15))+
    tlv('62',tlv('05',txid.replace(/[^A-Za-z0-9]/g,'').slice(0,25)))+'6304';
  return p+crc16(p);
}

const docFmt = s => { const d=s.replace(/\D/g,''); return d.length===11&&/^[\d.\-\s]+$/.test(s)?`${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`:s.trim(); };

const pager = pg => pg.n<=1?'':`<div class="pager"><button data-act="pg" data-k="${pg.key}" data-d="-1" ${pg.p===0?'disabled':''} aria-label="Página anterior">‹</button><span>${pg.p+1} / ${pg.n}</span><button data-act="pg" data-k="${pg.key}" data-d="1" ${pg.p>=pg.n-1?'disabled':''} aria-label="Próxima página">›</button></div>`;
/* Abre o WhatsApp de verdade (app), nunca o SMS.
   No celular usa o endereço do próprio app (whatsapp://); se o app não abrir em 1,5 s, cai no WhatsApp Web. */
function abrirWhatsApp(numero,texto){
  let n=String(numero||'').replace(/\D/g,''); if(n&&!n.startsWith('55')) n='55'+n;
  const q=(n?`phone=${n}&`:'')+'text='+encodeURIComponent(texto||'');
  const app='whatsapp://send?'+q, web='https://api.whatsapp.com/send?'+q;
  const celular=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(!celular){ const w=window.open(web,'_blank','noopener'); if(!w) location.href=web; return; }
  let saiu=false; const marca=()=>{saiu=true;};
  document.addEventListener('visibilitychange',marca,{once:true}); window.addEventListener('pagehide',marca,{once:true});
  location.href=app;
  setTimeout(()=>{ if(!saiu&&!document.hidden){ const w=window.open(web,'_blank','noopener'); if(!w) location.href=web; } },1500);
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),Math.max(2400,msg.length*55));}
async function copiar(txt,okMsg){try{await navigator.clipboard.writeText(txt);toast(okMsg||'Copiado');}catch(e){toast('Não deu para copiar. Selecione o texto e copie.');}}
function linkPublico(cfg,codigo){const base=(cfg.urlPublica||'').trim()||(location.origin+location.pathname);return base.replace(/#.*$/,'')+'#r-'+codigo;}
function drawQRs(){

    el.innerHTML=''; const size=+el.dataset.size||180;
    if(window.QRCode) new QRCode(el,{text:el.dataset.qr,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});
    else el.textContent='QR indisponível';
  });
}
function slotTxt(s){
  const l=s.capacidade-s.ocupadas;
  if(s.status!=='aberta') return 'Encerrada';
  if(!s.vendendo) return Date.now()>=saidaTs(s)?'Já saiu':'Vendas fechadas';
  return l<=0?'Esgotado':l===1?'1 lugar':`${l} lugares`;
}

/* ---------- desenho do barco com assentos ---------- */
function seatMap(cap,mapa,sel=[],interativo=false){
  const rows=Math.ceil(cap/4); let h='';
  for(let r=0;r<rows;r++){
    h+='<div class="srow">';
    for(let c=0;c<4;c++){
      if(c===2) h+='<span></span>';
      const n=r*4+c+1;
      if(n>cap){ h+='<span class="seat s-void"></span>'; continue; }
      const st=sel.includes(n)?'sel':(mapa[n]?.st||'free');
      const livre=st==='free'||st==='sel';
      h+= interativo&&livre
        ? `<button class="seat s-${st}" data-act="seat" data-n="${n}" aria-pressed="${st==='sel'}" aria-label="Assento ${n}">${n}</button>`
        : `<span class="seat s-${st}" title="Assento ${n}">${n}</span>`;
    }
    h+='</div>';
  }
  return `<div class="boat"><div class="hull"><div class="bow">▲ PROA</div>${h}<div class="stern">POPA · TIMÃO</div></div></div>
  <div class="legend">
    <span><i class="s-free"></i>Livre</span>${interativo?'<span><i class="s-sel"></i>Escolhido</span>':''}
    <span><i class="s-res"></i>Aguardando Pix</span><span><i class="s-pago"></i>Vendido</span><span><i class="s-emb"></i>Embarcado</span>
  </div>`;
}

      return `<button class="slot" data-act="saida" data-id="${s.id}" aria-pressed="${s.id===ui.saidaId}" ${dis?'disabled':''}>
        <span class="h">${s.hora}</span><span class="r">${s.vendendo&&s.ocupadas<s.capacidade?`vende até ${hora(s.fechaEm)}`:(esc(s.rotulo)||'&nbsp;')}</span>
        <span class="gauge ${pct>=100?'full':pct>=80?'hi':''}"><i style="width:${pct}%"></i></span>
        <span class="vagas ${dis?'z':''}">${slotTxt(s)}</span></button>`;}).join('')}</div>`

  </section>

  ${sel?`

    <div class="row between"><h2>2 · Assentos</h2><span class="sub">${livres} livres de ${sel.capacidade}</span></div>

    <h2>3 · Passagens e valor</h2>

      <div class="f">Passagens<div class="stepper"><button data-act="qtd" data-d="-1" aria-label="Menos">−</button><output>${ui.qtd}</output><button data-act="qtd" data-d="1" aria-label="Mais" ${ui.qtd>=livres?'disabled':''}>+</button></div></div>
      <label class="f">Valor por pessoa (R$)<input id="preco" class="big" type="number" inputmode="decimal" step="0.01" min="${barco.precoMin}" value="${vu}" ${barco.precoMin>=barco.preco?'readonly':''}></label>
    </div>

    <div class="row between sub" style="margin:0" id="tDescRow" ${vu<barco.preco?'':'hidden'}><span>Desconto dado (R$)</span><span id="tDesc">${money((barco.preco-vu)*ui.qtd)}</span></div>
    ${ui.err?`<div class="err-banner">${esc(ui.err)}</div>`:''}

    <p class="sub" style="margin:0">Os lugares ficam presos por <b>${barco.tempoPag} min</b> para o turista pagar.</p>

}

function formPax(r,travado){
  const pax=Array.from({length:r.qtd},(_,i)=>r.passageiros[i]||{nome:'',doc:''});
  return `<form id="fPax" class="list" style="gap:10px" novalidate>
    ${pax.map((p,i)=>`<div class="pax"><div class="row between"><span class="k">Passageiro ${i+1}</span><span class="k">Assento ${r.assentos[i]??'—'}</span></div>
      <input type="text" id="n${i}" placeholder="Nome completo" value="${esc(p.nome)}" ${i===0?'autocomplete="name"':''} ${travado?'disabled':''}>
      <input type="text" id="d${i}" placeholder="CPF ou RG" value="${esc(p.doc)}" ${travado?'disabled':''}></div>`).join('')}
    <label class="f">Seu WhatsApp (para receber o voucher)<input type="tel" id="tz" inputmode="numeric" placeholder="(21) 99999-9999" value="${esc(fone(r.whatsapp))}" ${travado?'disabled':''}></label>
  </form>`;
}
function lerPax(qtd){
  const lista=[];
  for(let i=0;i<qtd;i++){ const n=$('#n'+i).value.trim(), d=$('#d'+i).value.trim();
    if(n.split(/\s+/).length<2) throw new Error(`Passageiro ${i+1}: escreva nome e sobrenome.`);
    if(d.replace(/\W/g,'').length<5) throw new Error(`Passageiro ${i+1}: informe CPF ou RG.`);
    lista.push({nome:n,doc:docFmt(d)}); }
  return lista;
}

async function dadosFechamento(data,barcoId){
  const [res,proms,saidas]=[await api.reservas({data}),await api.promotores(),await api.saidas(data)];
  const doBarco=r=>!barcoId||r.saida.barcoId===barcoId;
  const todas=res.filter(doBarco), pagas=todas.filter(r=>r.status==='pago');
  const soma=(arr,f)=>arr.reduce((a,r)=>a+f(r),0);
  const tot={bruto:soma(pagas,r=>r.valor),com:soma(pagas,r=>r.comissao),pax:soma(pagas,r=>r.qtd),vendas:pagas.length,
    desc:soma(pagas,r=>Math.max(0,(r.precoTabela??r.valorUnit)-r.valorUnit)*r.qtd)};
  tot.liq=tot.bruto-tot.com; tot.ticket=tot.pax?tot.bruto/tot.pax:0;
  const porVend=proms.map(p=>{const x=pagas.filter(r=>r.promotorId===p.id);return {nome:p.nome,cod:p.codigo,pix:p.pixChave||'',vendas:x.length,pax:soma(x,r=>r.qtd),bruto:soma(x,r=>r.valor),com:soma(x,r=>r.comissao),desc:soma(x,r=>Math.max(0,(r.precoTabela??r.valorUnit)-r.valorUnit)*r.qtd)};})
    .filter(v=>v.vendas).sort((a,b)=>b.bruto-a.bruto).map(v=>({...v,liq:v.bruto-v.com}));
  const porSaida=saidas.filter(s=>!barcoId||s.barcoId===barcoId).map(s=>{const x=pagas.filter(r=>r.saidaId===s.id);return {nome:`${s.barco.nome} ${s.hora}`,cap:s.capacidade,pax:soma(x,r=>r.qtd),bruto:soma(x,r=>r.valor),com:soma(x,r=>r.comissao)};})
    .map(v=>({...v,liq:v.bruto-v.com,ocup:v.cap?v.pax/v.cap*100:0}));
  const pend=todas.filter(r=>['aguardando','pagamento_informado'].includes(r.status));
  return {tot,porVend,porSaida,pend,pendValor:soma(pend,r=>r.valor),venc:todas.filter(r=>r.status==='expirada').length,canc:todas.filter(r=>r.status==='cancelada').length};
}

      <p class="sub" style="margin:0">Os dados ficam salvos neste aparelho até o banco de dados ser ligado. Recomeçar apaga tudo e recarrega o exemplo.</p>
      ${ui.confirmReset?`<div class="err-banner">Apagar todas as vendas e cadastros deste aparelho?</div><div class="row"><button class="btn hot grow" data-act="resetOk">Sim, apagar</button><button class="btn ghost grow" data-act="resetNo">Não</button></div>`
      :`<button class="btn ghost" data-act="reset">Recomeçar com dados de exemplo</button>`}
    </section>`;
}

const VIEWS={vender:vVender,cracha:vCracha,turista:vTurista,cais:vCais,manifesto:vManifesto,gestao:vGestao};
const TIT={vender:'Vender',cracha:'Crachá',turista:'Sua reserva',cais:'Embarque',manifesto:'Manifesto',gestao:'Gestão'};
const CTX={vender:'Venda na orla',cracha:'Credencial do promotor',turista:'Sua reserva',cais:'Embarque no cais',manifesto:'Capitania dos Portos',gestao:'Dono da embarcação'};
async function render(){
  $('#app').innerHTML=await VIEWS[ui.view]();
  $('#appTitle').textContent=TIT[ui.view]; $('#ctx').textContent='MarLagos · '+CTX[ui.view];
  document.querySelectorAll('.dnav[data-go]').forEach(b=>{ if(b.dataset.go===ui.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('#btnMenu').hidden=ui.view==='turista';
  $('#demobar').innerHTML=ui.view==='turista'?`<div class="demo-bar no-print"><span>Tela que o turista vê ao abrir o link</span><button data-act="sairTurista">Voltar ao painel</button></div>`:'';
  $('#upd').textContent=new Date(ui.atualizadoEm).toTimeString().slice(0,5);
  drawQRs(); tick();
  if(ui.view==='cais'&&ui.camOn&&scan.video){ const c=$('#cam'); if(c){ c.prepend(scan.video); scan.video.play().catch(()=>{}); } }
}
function tick(){
  document.querySelectorAll('[data-countdown]').forEach(el=>{
    const ms=+el.dataset.countdown-Date.now();
    if(ms<=0){ el.textContent='00:00'; if(!tick.busy){tick.busy=true;setTimeout(()=>{tick.busy=false;atualizar(true);},500);} return; }
    const s=Math.floor(ms/1000); el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  });
}
setInterval(tick,1000);
async function atualizar(silencioso){
  // relê os dados da fonte (hoje: o aparelho; depois: o banco) e redesenha
  mem=null; load(); persist(); ui.atualizadoEm=Date.now(); await render();
  if(!silencioso) toast('Atualizado às '+new Date().toTimeString().slice(0,8));
}

  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, c=a.dataset.c;
  switch(act){
    case 'atualizar': return atualizar();
    case 'zapEnviar': return abrirWhatsApp(ui.zap,ui.msg);
    case 'zapGuardar': return abrirWhatsApp(ui.zapVoucher?.num,ui.zapVoucher?.txt||'');
    case 'menu': return menu(true);
    case 'menuFechar': return menu(false);
    case 'camera': return ui.camOn?(fecharCamera(),render()):abrirCamera();
    case 'pg': pages[a.dataset.k]=(pages[a.dataset.k]||0)+(+a.dataset.d); return render();
    case 'barco': ui.barcoId=a.dataset.id; ui.saidaId=null; ui.assentos=[]; ui.preco=null; ui.err=''; return render();
    case 'saida': ui.saidaId=a.dataset.id; ui.assentos=[]; ui.err=''; return render();
    case 'seat': { const n=+a.dataset.n; ui.assentos=ui.assentos.includes(n)?ui.assentos.filter(x=>x!==n):[...ui.assentos,n]; if(!ui.assentos.length) ui.qtd=1; ui.err=''; return render(); }
    case 'qtd': ui.assentos=[]; ui.qtd=Math.max(1,Math.min(99,ui.qtd+(+a.dataset.d))); return render();
    case 'gerar':
      try{ const r=await api.criarReserva({saidaId:ui.saidaId,promotorId:ui.promotorId,qtd:ui.qtd,assentos:ui.assentos,valorUnit:ui.preco}); ui.ultima=r.codigo; ui.err=''; ui.zap=''; ui.assentos=[]; ui.preco=null; }
      catch(err){ ui.err=err.message; }
      render(); return window.scrollTo(0,0);
    case 'mostrarQR': ui.ultima=c; ui.zap=''; render(); return window.scrollTo(0,0);
    case 'novaVenda': ui.ultima=null; ui.saidaId=null; ui.zap=''; ui.qtd=2; ui.assentos=[]; ui.preco=null; return render();
    case 'copiarLink': return copiar(ui.msg,'Mensagem copiada');
    case 'abrirTurista': ui.turista=c; ui.turErr=''; ui.voltar=ui.view; ui.view='turista'; history.replaceState(null,'','#r-'+c); render(); return window.scrollTo(0,0);
    case 'sairTurista': return go(ui.voltar||'vender');
    case 'copiarPix': return copiar($('#pixtxt').textContent,'Código Pix copiado. Cole no app do banco.');
    case 'informarPix': {
      const r=await api.reserva(ui.turista);
      try{ await api.informarPagamento(ui.turista,lerPax(r.qtd),$('#tz').value.replace(/\D/g,'')); ui.turErr=''; }catch(err){ ui.turErr=err.message; }
      render(); return window.scrollTo(0,0);
    }
    case 'salvarPax': {
      const r=await api.reserva(ui.turista);
      try{ await api.salvarPassageiros(ui.turista,lerPax(r.qtd),$('#tz').value.replace(/\D/g,'')); ui.turErr=''; }catch(err){ ui.turErr=err.message; }
      return render();
    }
    case 'baixarVoucher': return baixarVoucher(c);
    case 'confirmar':
      try{ const extra=await api.confirmarPagamento(c); toast(`${c} pago · voucher liberado${extra}`); }catch(err){ toast(err.message); }
      return render();
    case 'cancelar': await api.cancelar(c); toast(`${c} cancelada · lugares liberados`); return render();
    case 'cracha': return go('cracha');
    case 'caisAbrir': ui.caisCodigo=c; return validarCais();
    case 'emb': await api.embarcar(c,+a.dataset.i,a.checked); ui.caisMsg.r=await api.reserva(c); return render();
    case 'embTodos': await api.embarcar(c,'all'); ui.caisMsg.r=await api.reserva(c); toast('Embarque confirmado no manifesto'); return render();
    case 'copiarMan': {
      const s=(await api.saidas(hoje())).find(x=>x.id===ui.manSaida); const l=await linhasManifesto(s.id);
      const txt=`MANIFESTO DE PASSAGEIROS\nEmbarcação: ${s.barco.nome} · Inscrição ${s.barco.inscricao}\nMestre: ${s.barco.mestre}\nSaída: ${dataBR(s.data)} ${s.hora} · ${s.barco.cais}\n\n`+
        l.map(p=>`Assento ${p.assento??'-'} · ${p.nome} · ${p.doc} · ${p.embarcado?'EMBARCADO':'A EMBARCAR'}`).join('\n')+`\n\nTotal: ${l.length} de ${s.capacidade} lugares · ${l.filter(p=>p.embarcado).length} embarcados`;
      return copiar(txt,'Manifesto copiado');
    }
    case 'imprimir': return window.print();
    case 'copiarFech': return copiar(await textoFechamento(),'Fechamento copiado');
    case 'gtab': ui.gTab=a.dataset.t; ui.edit=null; ui.confirmReset=false; return render();
    case 'novo': ui.edit={tipo:a.dataset.tipo,obj:null}; return render();
    case 'editar': { const lst=a.dataset.tipo==='barco'?await api.barcos():await api.promotores(); ui.edit={tipo:a.dataset.tipo,obj:lst.find(x=>x.id===a.dataset.id)}; return render(); }
    case 'fecharEdit': ui.edit=null; return render();
    case 'toggleSaida': await api.salvarSaida({id:a.dataset.id,status:a.dataset.st==='aberta'?'encerrada':'aberta'}); return render();
    case 'reset': ui.confirmReset=true; return render();
    case 'resetNo': ui.confirmReset=false; return render();
    case 'resetOk': await api.resetar(); ui.confirmReset=false; ui.ultima=null; toast('Dados de exemplo recarregados'); return render();
  }
});

  const a=e.target.closest('[data-act]'); if(!a) return;

async function atualizaPreco(v){
  const prom=(await api.promotores()).find(p=>p.id===ui.promotorId), b=(await api.barcos()).find(x=>x.id===ui.barcoId);
  const vu=parseFloat(String(v).replace(',','.')); ui.preco=isNaN(vu)?null:vu;
  const u=ui.preco??b.preco, rg=regraComissao(b,prom);
  $('#tTotal').innerHTML=money(u*ui.qtd); $('#tCom').innerHTML=money(calcComissao(rg,u,ui.qtd));
  $('#tDescRow').hidden=!(u<b.preco); $('#tDesc').innerHTML=money(Math.max(0,b.preco-u)*ui.qtd);
  const info=$('#precoInfo'); const baixo=u<b.precoMin;
  info.innerHTML=baixo?`<b style="color:var(--danger)">Abaixo do mínimo de R$ ${fmt(b.precoMin)}</b>`:`Tabela R$ ${fmt(b.preco)} · mínimo R$ ${fmt(b.precoMin)}`;
  document.querySelector('[data-act=gerar]').disabled=baixo;
}
async function validarCais(auto){
  const raw=(ui.caisCodigo||'').trim().toUpperCase(); const mm=raw.match(/AC-\d{4}/); const cod=mm?mm[0]:raw;
  if(!cod){ ui.caisMsg={erro:'Digite ou leia o código do voucher.'}; return render(); }
  const r=await api.reserva(cod);
  if(!r) ui.caisMsg={erro:`Voucher ${cod} não encontrado.`};
  else if(r.status!=='pago') ui.caisMsg={r,ok:false,aviso:`Pagamento não confirmado (${STATUS[r.status]}). Não embarcar sem confirmação.`};
  else if(r.saida.data!==hoje()) ui.caisMsg={r,ok:false,aviso:`Este voucher é para ${dataBR(r.saida.data)}.`};
  else if(r.saidaId!==ui.caisSaida) ui.caisMsg={r,ok:false,aviso:`Atenção: voucher do ${r.barco.nome} às ${r.saida.hora}, não desta saída.`};
  else ui.caisMsg={r,ok:true};
  if(auto&&ui.caisMsg.ok&&ui.autoEmb&&r.passageiros.length){
    const n=r.passageiros.filter(p=>!p.embarcado).length;
    if(n){ await api.embarcar(r.codigo,'all'); ui.caisMsg={r:await api.reserva(r.codigo),ok:true,auto:n}; }
    else ui.caisMsg={r,ok:false,aviso:'Este voucher já embarcou. Leitura repetida.'};
  } else if(auto&&ui.caisMsg.ok&&!r.passageiros.length) ui.caisMsg={r,ok:false,aviso:'Pago, mas sem passageiros cadastrados. Peça para preencher no link.'};
  await render();
  return !!ui.caisMsg?.ok;
}

  if(f.id==='fCais'){ ui.caisCodigo=$('#caisCod').value; return validarCais(); }
  if(f.id==='fBarco'){

    const b={...(ui.edit.obj||{}),nome:$('#bNome').value.trim(),inscricao:$('#bInsc').value.trim(),mestre:$('#bMestre').value.trim(),cais:$('#bCais').value.trim(),
      capacidade:+$('#bCap').value||1,preco:+$('#bPreco').value||0,precoMin:Math.min(+$('#bPMin').value||+$('#bPreco').value||0,+$('#bPreco').value||0),comissaoTipo:$('#bCTipo').value,comissaoValor:+$('#bCVal').value||0,horarios:hor,
      tempoPag:+$('#bTP').value||REGRAS_PADRAO.tempoPag,tempoConf:+$('#bTC').value||REGRAS_PADRAO.tempoConf,corteMin:+$('#bCorte').value||0,
      pixChave:$('#bPix').value.trim(),pixNome:$('#bPixN').value.trim(),pixCidade:$('#bPixC').value.trim(),ativo:$('#bAtivo').checked};
    if(!b.nome||!b.pixChave){ toast('Preencha nome e chave Pix'); return; }
    await api.salvarBarco(b); ui.edit=null; toast('Barco salvo'); return render();
  }
  if(f.id==='fProm'){
    const p={...(ui.edit.obj||{}),nome:$('#pNome').value.trim(),codigo:$('#pCod').value.trim(),whatsapp:$('#pZap').value.replace(/\D/g,''),pixChave:$('#pPix').value.trim(),comissaoTipo:$('#pCTipo').value,comissaoValor:+$('#pCVal').value||0,
      barcoIds:[...document.querySelectorAll('.pBarco:checked')].map(x=>x.value),ativo:$('#pAtivo').checked};

  }
  if(f.id==='fSaida'){
    const m=$('#sHora').value.trim().match(/^(\d{1,2}):?(\d{2})$/); if(!m){ toast('Horário no formato 17:30'); return; }
    await api.salvarSaida({barcoId:$('#sBarco').value,data:ui.gData,hora:m[1].padStart(2,'0')+':'+m[2],rotulo:$('#sRot').value.trim(),capacidade:+$('#sCap').value||1});
    ui.edit=null; toast('Saída criada'); return render();
  }
  if(f.id==='fCfg'){ await api.salvarConfig({urlPublica:$('#cUrl').value.trim()}); toast('Endereço salvo'); return render(); }
});

/* =========================================================
   LEITOR DE QR PELA CÂMERA
   Usa o leitor nativo do celular (BarcodeDetector) quando existe;
   senão a biblioteca jsQR. Se não houver câmera, fica a digitação.
   ========================================================= */
const scan={stream:null,video:null,canvas:null,ctx:null,det:null,busy:false,t:0,raf:0,last:'',lastAt:0,audio:null};
async function abrirCamera(){
  ui.camErro='';
  if(!navigator.mediaDevices?.getUserMedia){ ui.camErro='Este aparelho não liberou a câmera aqui. Use a digitação.'; return render(); }
  try{ scan.audio=scan.audio||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  try{ scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}); }
  catch(e){ ui.camErro=e.name==='NotAllowedError'?'Permissão da câmera negada. Libere nas configurações do navegador ou use a digitação.':'Câmera indisponível neste aparelho. Use a digitação.'; return render(); }
  scan.video=document.createElement('video'); scan.video.setAttribute('playsinline',''); scan.video.muted=true; scan.video.srcObject=scan.stream;
  scan.det=null;
  if('BarcodeDetector' in window){ try{ const f=await BarcodeDetector.getSupportedFormats(); if(f.includes('qr_code')) scan.det=new BarcodeDetector({formats:['qr_code']}); }catch(e){} }
  if(!scan.det&&!window.jsQR){ fecharCamera(); ui.camErro='Leitor de QR não carregou (sem internet?). Use a digitação.'; return render(); }
  scan.canvas=scan.canvas||document.createElement('canvas'); scan.ctx=scan.canvas.getContext('2d',{willReadFrequently:true});
  ui.camOn=true; await render(); loopScan();
}
function fecharCamera(){
  cancelAnimationFrame(scan.raf); ui.camOn=false;
  if(scan.stream){ scan.stream.getTracks().forEach(t=>t.stop()); scan.stream=null; }
  if(scan.video){ scan.video.remove(); scan.video=null; }
}
function loopScan(){
  if(!ui.camOn) return;
  scan.raf=requestAnimationFrame(loopScan);
  const now=performance.now(), v=scan.video;
  if(scan.busy||now-scan.t<200||!v||v.readyState<2) return;
  scan.t=now; scan.busy=true;
  lerQuadro(v).then(txt=>txt?qrLido(txt):null).catch(()=>{}).finally(()=>{scan.busy=false;});
}
async function lerQuadro(v){
  if(scan.det){ const r=await scan.det.detect(v); return r[0]?.rawValue||null; }
  const k=Math.min(1,720/v.videoWidth), w=Math.round(v.videoWidth*k), h=Math.round(v.videoHeight*k);
  scan.canvas.width=w; scan.canvas.height=h; scan.ctx.drawImage(v,0,0,w,h);
  const img=scan.ctx.getImageData(0,0,w,h); const r=jsQR(img.data,w,h,{inversionAttempts:'dontInvert'});
  return r?.data||null;
}
function bip(ok){
  try{ navigator.vibrate?.(ok?80:[60,60,60]); }catch(e){}
  try{ const a=scan.audio; if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.frequency.value=ok?1320:330; g.gain.value=.15; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(ok?.12:.35)); }catch(e){}
}
async function qrLido(txt){
  const m=String(txt).toUpperCase().match(/AC-\d{4}/); const cod=m?m[0]:String(txt).trim();
  if(cod===scan.last&&Date.now()-scan.lastAt<4000) return;
  scan.last=cod; scan.lastAt=Date.now();
  ui.caisCodigo=cod;
  const ok=await validarCais(true);
  bip(ok);
  const fb=$('#camfb'); if(fb){ fb.hidden=false; fb.className='fb '+(ok?'ok':'err'); fb.textContent=ok?`✓ ${cod} · ${ui.caisMsg.auto?ui.caisMsg.auto+' a bordo':'válido'}`:`✕ ${cod} · ${ui.caisMsg?.aviso||ui.caisMsg?.erro||'inválido'}`; }
}
